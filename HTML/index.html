
<!Doctype html>
<!-- A doctype declaration  is a declaration that tells the browser which version of HTML the page is written in -->

<!-- this the html element it has opening and closing tags -->

<head>
   <title>First Website</title>
   <style>
      img {
         width: 100px;
         border-radius: 50px;
         float: left;
         margin-right: 20px;

      }

      p.username {
         font-weight: bold;
      }
   </style>
</head>
<!-- We use the head to define the document's metadata -->

<body>
   <!-- the body contains the visible content of the webpage -->

   <img src="Images/AllyAdams.jpg" alt="AllyAdams">
   <!-- the image element has no closing tag 
 the src attribute specifies the path to the image file
 the alt attribute provides alternative text for the image -->

   <p class="username">@AllyAdams</p>
   <p>My name is Ally Adams and I am a web developer. I have been working in the field for 5 years and have experience
      with HTML, CSS, JavaScript, and various frameworks. I enjoy creating responsive and user-friendly websites that
      provide a great user experience.</p>
</body>

</html>
